# Supports: nova-lite-v2:0, nova-pro-v1:0 (update model_id and model_name)

logging:
  level: "INFO"

tracking:
  return_usage: true
  progress_interval: 50

pricing:
  input_per_1m_tokens: 0.8
  output_per_1m_tokens: 3.2

video_source:
  type: "s3"
  mode: "from_s3"
  s3:
    bucket: "your-s3-bucket"
    prefix: "youtube_ads_dataset_h264"
    region: "us-east-1"

video_selection:
  mode: "all"
  random_count: 100
  random_seed: null

pipeline:
  preprocessor:
    type: null

  tagger:
    type: "bedrock_vision"
    config:
      model_id: "us.amazon.nova-pro-v1:0"
      model_name: "nova-pro-v1"
      region_name: "us-east-1"
      api_type: "converse"
      custom_system_prompt: null
      custom_user_prompt: "coactive_user.txt"

  result_writer:
    type: "jsonl"
    config:
      output_path: "data/outputs/video_level_tags.jsonl"

  metrics:
    type: "multilabel_classification"
    config:
      pred_key: "video_level_tags"
      gt_key: "tags"
      exclude_tags: ['funny', 'effective', 'exciting']
      exclude_failures: true

result_saver:
  type: "json"
  config:
    include_timestamp: true

inference:
  threshold: 0.5
  ignore_threshold: true
  test_tags: null

paths:
  inputs_dir: "data/inputs"
  label_file: "video_annotations_coactive.json"
  tag_descriptions_file: "tag_descriptions_coactive.json"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache/videos"

labels:
  gt_threshold: 0.5
