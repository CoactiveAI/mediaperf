# Supports: gpt-5.1, gpt-5.4, gpt-5-mini, gpt-5-nano (update model_id and model_name)

logging:
  level: "DEBUG"

tracking:
  return_usage: true
  progress_interval: 1

pricing:
  input_per_1m_tokens: 1.25
  output_per_1m_tokens: 10.00

video_source:
  type: "s3"
  mode: "local"
  s3:
    bucket: "your-s3-bucket"
    prefix: "youtube_ads_dataset_h264"
    region: "us-east-1"

video_selection:
  mode: "random"
  random_count: 5
  random_seed: 42

pipeline:
  preprocessor:
    type: "frame_sampling"
    config:
      x_frames: 16

  tagger:
    type: "openai_vision"
    config:
      model_id: "gpt-5.1"
      model_name: "gpt-5_1"
      api_key_env: "OPENAI_API_KEY"
      reasoning_effort: "low"

  result_writer:
    type: "jsonl"
    config:
      output_path: "data/outputs/video_level_tags.jsonl"

  metrics:
    type: "multilabel_classification"
    config:
      pred_key: "video_level_tags"
      gt_key: "tags"
      exclude_tags: ['funny', 'effective', 'exciting']
      exclude_failures: true

result_saver:
  type: "json"
  config:
    include_timestamp: true

inference:
  threshold: 0.5
  ignore_threshold: true
  test_tags: null

paths:
  inputs_dir: "data/inputs"
  label_file: "YoutubeAdvertisementsLabels.json"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache/videos"

labels:
  gt_threshold: 0.5
