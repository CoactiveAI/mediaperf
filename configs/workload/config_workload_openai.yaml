# Supports: gpt-5.1, gpt-5.4, gpt-5-mini, gpt-5-nano (update model_id and model_name)

task_type: "cost_benchmark"

logging:
  level: "INFO"

tracking:
  return_usage: true
  progress_interval: 50

pricing:
  input_per_1m_tokens: 1.25
  output_per_1m_tokens: 10.00

cost_benchmark:
  iterations:
    - iteration: 1
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_1.txt"
      skip_tag_injection: true

    - iteration: 2
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_2.txt"
      skip_tag_injection: true

    - iteration: 3
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_3.txt"
      skip_tag_injection: true

    - iteration: 4
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_4.txt"
      skip_tag_injection: true

    - iteration: 5
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_5.txt"
      skip_tag_injection: true

  metrics_output_path: "cost_benchmark_metrics_gpt.json"

video_source:
  type: "s3"
  mode: "local"
  s3:
    bucket: "your-s3-bucket"
    prefix: "youtube_ads_dataset"
    region: "us-east-1"

video_selection:
  mode: "duration_based"
  target_minutes: 1000
  metadata_file: "data/inputs/youtube_ads_video_metadata.json"
  order: "longest"
  resolution: null

pipeline:
  preprocessor:
    type: "frame_sampling"
    config:
      x_frames: 32
      storage:
        type: "s3"
        config:
          bucket: "your-s3-bucket"
          prefix: "frames"
          region_name: "us-east-1"

  tagger:
    type: "openai_vision"
    config:
      model_id: "gpt-5.1"
      model_name: "gpt-5_1"
      api_key_env: "OPENAI_API_KEY"
      inference_params:
        reasoning:
          effort: "low"

  result_writer:
    type: "jsonl"
    config:
      output_path: "data/outputs/cost_benchmark_results_gpt.jsonl"

  metrics:
    type: "multilabel_classification"
    config:
      pred_key: "video_level_tags"
      gt_key: "tags"
      exclude_tags: ['funny', 'effective', 'exciting']
      exclude_failures: true

result_saver:
  type: "json"
  config:
    include_timestamp: true

inference:
  threshold: 0.5
  ignore_threshold: true
  test_tags: null

paths:
  inputs_dir: "data/inputs"
  label_file: "video_annotations_youtube_ads.json"
  tag_descriptions_file: "tag_descriptions_youtube_ads.json"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache/videos"

labels:
  gt_threshold: 0.5
