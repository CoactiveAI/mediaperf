# Supports: nova-lite-v2:0, nova-pro-v1:0 (update model_id and model_name)

task_type: "summarization"

logging:
  level: "DEBUG"

tracking:
  return_usage: true
  progress_interval: 1

pricing:
  input_per_1m_tokens: 0.8
  output_per_1m_tokens: 3.2

video_source:
  type: "s3"
  mode: "from_s3"
  s3:
    bucket: "your-s3-bucket"
    prefix: "youtube_ads_dataset_h264"
    region: "us-east-1"

video_selection:
  mode: "random"
  random_count: 3
  random_seed: null

pipeline:
  preprocessor:
    type: null

  summarizer:
    type: "bedrock_summarizer"
    config:
      model_id: "us.amazon.nova-pro-v1:0"
      model_name: "nova-pro-1"
      region_name: "us-east-1"
      api_type: "converse"
      input_type: "s3_uri"
      user_prompt_file: "universal_user.txt"

  result_writer:
    type: "jsonl"
    config:
      output_path: "data/outputs/video_summaries.jsonl"

result_saver:
  type: "json"
  config:
    include_timestamp: true

paths:
  inputs_dir: "data/inputs"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache/videos"
