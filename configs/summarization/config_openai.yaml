# Supports: gpt-5.1, gpt-5.4, gpt-5-mini, gpt-5-nano (update model_id and model_name)

task_type: "summarization"

logging:
  level: "INFO"

tracking:
  return_usage: true
  progress_interval: 50

pricing:
  input_per_1m_tokens: 1.25
  output_per_1m_tokens: 10.00

video_source:
  type: "s3"
  mode: "local"
  s3:
    bucket: "your-s3-bucket"
    prefix: "youtube_ads_dataset"
    region: "us-east-1"

video_selection:
  mode: "all"

pipeline:
  preprocessor:
    type: "frame_sampling"
    config:
      x_frames: 32
      storage:
        type: "s3"
        config:
          bucket: "your-s3-bucket"
          prefix: "frames"
          region_name: "us-east-1"

  summarizer:
    type: "openai_summarizer"
    config:
      model_id: "gpt-5.1"
      model_name: "gpt-5_1"
      api_key_env: "OPENAI_API_KEY"
      inference_params:
        reasoning_effort: "low"
      user_prompt_file: "universal_user.txt"

  result_writer:
    type: "jsonl"
    config:
      output_path: "data/outputs/video_summaries_gpt.jsonl"

result_saver:
  type: "json"
  config:
    include_timestamp: true

paths:
  inputs_dir: "data/inputs"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache/videos"
