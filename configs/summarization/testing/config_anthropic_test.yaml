# Supports: claude-opus-4-6, claude-sonnet-4-5, claude-haiku-4-5 (update model_id and model_name)

task_type: "summarization"

logging:
  level: "DEBUG"

tracking:
  return_usage: true
  progress_interval: 1

pricing:
  input_per_1m_tokens: 1.00
  output_per_1m_tokens: 5.00

video_source:
  type: "s3"
  mode: "local"
  s3:
    bucket: "your-s3-bucket"
    prefix: "youtube_ads_dataset"
    region: "us-east-1"

video_selection:
  mode: "random"
  random_count: 5
  random_seed: 42

pipeline:
  preprocessor:
    type: "frame_sampling"
    config:
      x_frames: 16

  summarizer:
    type: "anthropic_summarizer"
    config:
      model_id: "claude-haiku-4-5"
      model_name: "claude-haiku-4.5"
      api_key_env: "ANTHROPIC_API_KEY"
      user_prompt_file: "universal_user.txt"

  result_writer:
    type: "jsonl"
    config:
      output_path: "data/outputs/video_summaries_anthropic.jsonl"

result_saver:
  type: "json"
  config:
    include_timestamp: true

paths:
  inputs_dir: "data/inputs"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache/videos"
