# NVIDIA Nemotron Nano 12B v2 VL via Bedrock (requires 720p H.264 videos and frame extraction)

task_type: "cost_benchmark"

logging:
  level: "DEBUG"

pricing:
  input_per_1m_tokens: 0.2
  output_per_1m_tokens: 0.6

tracking:
  return_usage: true
  progress_interval: 1

cost_benchmark:
  iterations:
    - iteration: 1
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_1.txt"
      skip_tag_injection: true

    - iteration: 2
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_2.txt"
      skip_tag_injection: true

    - iteration: 3
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_3.txt"
      skip_tag_injection: true

    - iteration: 4
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_4.txt"
      skip_tag_injection: true

    - iteration: 5
      prompt_path: "src/benchmarks/models/prompts/workload/user_prompt_iter_5.txt"
      skip_tag_injection: true

video_source:
  type: "s3"
  mode: "local"
  s3:
    bucket: "your-s3-bucket"
    prefix: "youtube_ads_dataset_720p_h264"
    region: "us-east-1"

video_selection:
  mode: "duration_based"
  target_minutes: 1
  metadata_file: "data/inputs/youtube_ads_video_metadata.json"
  order: "shortest"
  resolution: null

pipeline:
  preprocessor:
    type: "frame_sampling"
    config:
      x_frames: 16
      output_format: "bytes"

  tagger:
    type: "bedrock_vision"
    config:
      model_id: "nvidia.nemotron-nano-12b-v2"
      model_name: "nvidia-nemotron-nano-12b-v2"
      region_name: "us-east-1"
      api_type: "converse"
      input_type: "frames_bytes"
      inference_params:
        maxTokens: 1000
        temperature: 0.3
        topP: 0.1
        additional_model_fields:
          top_k: 20

  result_writer:
    type: "jsonl"
    config:
      output_path: "data/outputs/workload_benchmark_results.jsonl"

result_saver:
  type: "json"
  config:
    include_timestamp: true

inference:
  threshold: 0.5
  ignore_threshold: true
  test_tags: null

paths:
  inputs_dir: "data/inputs"
  label_file: "video_annotations_youtube_ads.json"
  tag_descriptions_file: "tag_descriptions_youtube_ads.json"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache/videos_nvidia_720p"

labels:
  gt_threshold: 0.5
